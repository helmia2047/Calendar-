name: Website Keep-Alive Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP GET Request
        run: |
          echo "Pinging website..."
          STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" https://mycalender-lqtx.onrender.com)
          echo "HTTP Status Code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Ping successful!"
          else
            echo "Ping failed with status $STATUS"
            exit 1
          fi
